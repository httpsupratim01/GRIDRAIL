services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  django:
    build:
      context: ./django_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  fastapi:
    build:
      context: ./fastapi_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL}
        VITE_FASTAPI_URL: ${VITE_FASTAPI_URL}
    restart: unless-stopped
    depends_on:
      - django
      - fastapi
    ports:
      - "80:80"

volumes:
  postgres_data:
